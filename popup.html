<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  :root{ --green:#25D366; --bg:#0b1412; --card:#16201d; --border:#1f332d; --text:#e8f5ef; --muted:#8fb0a3; }
  *{box-sizing:border-box;font-family: ui-sans-system, -apple-system, Segoe UI, Roboto, Inter, sans-serif;}
  body{margin:0;width:360px;background:var(--bg);color:var(--text);}
  header{padding:14px 16px;background:linear-gradient(135deg,#128C7E,#25D366);display:flex;align-items:center;gap:10px;}
  header h1{font-size:15px;margin:0;font-weight:800;letter-spacing:-0.02em}
  header span{font-size:11px;opacity:.9}
  .wrap{padding:12px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between}
  .val{color:var(--green);font-weight:800}
  input[type=range]{width:100%;accent-color:var(--green);height:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .footer{padding:10px 12px;font-size:10px;color:var(--muted);text-align:center}
  .badge{display:inline-flex;align-items:center;gap:4px;background:#10211c;border:1px solid #1e3a32;padding:4px 8px;border-radius:999px;font-size:10px}
  button{width:100%;background:var(--green);color:#06210f;border:0;padding:10px;border-radius:10px;font-weight:800;cursor:pointer}
  button:active{transform:scale(.98)}
</style>
</head>
<body>
<header>
  <div style="width:28px;height:28px;background:#fff;border-radius:8px;display:grid;place-items:center;color:#128C7E;font-weight:900">🎙</div>
  <div><h1>WA Mic Studio</h1><span>Full Equalizer • web.whatsapp.com</span></div>
</header>
<div class="wrap" id="sliders"></div>
<div class="wrap">
  <div class="card">
    <div style="display:flex;gap:8px">
      <button id="resetBtn" style="background:#1d332c;color:#9dcab6">Reset Flat</button>
      <button id="saveBtn">Save & Apply</button>
    </div>
    <div style="margin-top:8px;display:flex;gap:6px">
      <span class="badge">🟢 Live on WhatsApp Web</span>
      <span class="badge">⚡ No reload needed</span>
    </div>
  </div>
  <div class="footer">For entertainment • not official WhatsApp feature. Use headphones to test.</div>
</div>
<script src="popup.js"></script>
</body>
</html>
