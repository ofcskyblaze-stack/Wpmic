<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mic License Admin</title><style>body{font:15px system-ui;background:#10131b;color:#eee;max-width:850px;margin:30px auto;padding:0 16px}input,button{padding:10px;margin:4px;border-radius:7px;border:1px solid #555}input{background:#1b2130;color:white}button{cursor:pointer}pre{white-space:pre-wrap;background:#1b2130;padding:12px;border-radius:8px}.row{border-bottom:1px solid #333;padding:10px 0}</style></head><body><h1>WhatsApp Mic — License Admin</h1><p>API URL and admin secret are kept in this browser only.</p><input id="api" placeholder="https://your-service.onrender.com" size="40"><input id="secret" type="password" placeholder="ADMIN_SECRET"><button onclick="save()">Connect</button><hr><h3>Create license</h3><input id="days" type="number" min="0" placeholder="Days (0 = lifetime)"><input id="note" placeholder="User/note"><button onclick="create()">Create</button><h3>Licenses</h3><button onclick="list()">Refresh list</button><div id="out"></div><script>function cfg(){return{api:document.querySelector('#api').value.replace(/\/$/,''),secret:document.querySelector('#secret').value}}function save(){localStorage.setItem('mic-admin',JSON.stringify(cfg()));list()}function headers(){return{'Content-Type':'application/json','X-Admin-Secret':cfg().secret}}async function call(p,b){let c=cfg();let r=await fetch(c.api+p,{method:b?'POST':'GET',headers:headers(),body:b?JSON.stringify(b):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function create(){try{let x=await call('/api/admin/create',{days:+document.querySelector('#days').value,note:document.querySelector('#note').value});alert('New key: '+x.key);list()}catch(e){alert(e.message)}}async function toggle(k,a){try{await call('/api/admin/toggle',{key:k,active:a});list()}catch(e){alert(e.message)}}async function unbind(k){try{await call('/api/admin/unbind',{key:k});list()}catch(e){alert(e.message)}}async function list(){try{let x=await call('/api/admin/licenses');let o=document.querySelector('#out');o.innerHTML='';Object.entries(x.licenses).forEach(([k,v])=>{let d=document.createElement('div');d.className='row';let t=document.createElement('span');t.textContent=k+' — '+(v.active?'ACTIVE':'BLOCKED')+' — '+(v.note||'')+' — '+(v.deviceId?'device bound':'not activated');d.append(t);let b=document.createElement('button');b.textContent=v.active?'Block':'Unblock';b.onclick=()=>toggle(k,!v.active);d.append(b);let u=document.createElement('button');u.textContent='Unbind device';u.onclick=()=>unbind(k);d.append(u);o.append(d)})}catch(e){document.querySelector('#out').textContent=e.message}}try{let c=JSON.parse(localStorage.getItem('mic-admin')||'{}');document.querySelector('#api').value=c.api||'';document.querySelector('#secret').value=c.secret||''}catch{}</script></body></html>
